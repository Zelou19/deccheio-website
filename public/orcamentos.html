<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">

<title>Os meus orçamentos — De Cheio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css">

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand">
      <span class="brand-word">De</span>
      <img class="brand-heart" src="/img/fingerprint-heart.png" alt="" aria-hidden="true">
      <span class="brand-word">Cheio</span>

      <span id="ola-nome"></span>

    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
      <span></span><span></span><span></span>

<main class="wrap orcamentos-page">

  <p class="eyebrow">A sua conta</p>

  <div id="estado-carregamento">A carregar...</div>

  <div id="estado-vazio" hidden>

    <a href="/#orcamento" class="btn btn-primary">Pedir orçamento</a>

  <div class="abas-bar" id="abas-bar" hidden>
    <button type="button" class="aba-btn ativa" data-aba="abertas">Abertas</button>
    <button type="button" class="aba-btn" data-aba="fechadas">Fechadas</button>

  <div id="lista-orcamentos" class="orcamentos-lista"></div>

<script src="js/nav-toggle.js"></script>
