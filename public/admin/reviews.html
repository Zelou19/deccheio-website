<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliações — Admin — De Cheio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/eventos.css">
<link rel="stylesheet" href="../css/reviews-admin.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/logo512.png">
</head>
<body>

<main class="wrap" style="padding-bottom: 80px;">

  <div id="admin-conteudo">

    <div class="admin-header">
      <h1>Avaliações de clientes</h1>
      <div style="display:flex; align-items:center; gap:18px;">
        <a href="/admin/orcamentos.html" class="admin-sair" style="text-decoration:none;">Orçamentos</a>
        <a href="/admin/eventos.html" class="admin-sair" style="text-decoration:none;">Os nossos eventos</a>
        <a href="/admin/conta.html" class="admin-sair" style="text-decoration:none;">A minha conta</a>
        <a href="/admin/index.html" class="admin-sair" style="text-decoration:none;">&larr; Pedidos de orçamento</a>
      </div>
    </div>

    <div id="aviso-nao-owner" hidden>
      <p style="color: var(--taupe);">Só o dono da conta pode gerir as avaliações mostradas no site.</p>
    </div>

    <div id="area-owner" hidden>
      <p style="color: var(--taupe); font-size: 0.9rem; max-width: 60ch;">
        As avaliações que adicionares aqui aparecem, por ordem, na secção "O que dizem os nossos clientes" da página inicial.
      </p>

      <form id="form-nova-review" class="nova-review-form">
        <div class="form-row-review">
          <input type="text" id="review-nome" placeholder="Nome do cliente" required>
          <input type="text" id="review-tipo-evento" placeholder="Tipo de evento (opcional)">
        </div>
        <div class="form-row-review">
          <label for="review-estrelas">Classificação</label>
          <select id="review-estrelas">
            <option value="5" selected>★★★★★ (5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="3">★★★ (3)</option>
            <option value="2">★★ (2)</option>
            <option value="1">★ (1)</option>
          </select>
        </div>
        <textarea id="review-texto" rows="3" placeholder="O que o cliente disse..." required></textarea>
        <button type="submit" class="btn btn-primary">Adicionar avaliação</button>
      </form>
      <p id="review-feedback" class="form-feedback" role="status" aria-live="polite"></p>

      <div id="lista-reviews" class="lista-reviews-admin"></div>
    </div>

  </div>

</main>

<script src="../js/admin-session.js"></script>
<script src="../js/admin-reviews.js"></script>
</body>
</html>
