<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversa — Admin — De Cheio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/chat.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/logo512.png">
</head>
<body>

<main class="wrap chat-page">
  <p style="display:flex; justify-content:space-between; align-items:center;">
    <a href="/admin/">&larr; Voltar à lista</a>
    <span style="display:flex; gap:18px;">
      <a href="/admin/conta.html" class="admin-sair" style="text-decoration:none;">A minha conta</a>
      <button class="admin-sair" id="btn-sair">Sair</button>
    </span>
  </p>

  <div id="estado-carregamento">A carregar...</div>

  <div id="conteudo-pedido" hidden>
    <div class="pedido-cabecalho">
      <div>
        <p class="eyebrow" id="pedido-tipo">—</p>
        <h1 id="pedido-titulo">—</h1>
      </div>
      <button type="button" id="btn-editar-pedido" class="btn-toggle-fechar">Editar dados</button>
    </div>
    <p style="color: var(--taupe); margin-top: -0.6em;" id="pedido-info-vista">
      <span id="pedido-email"></span> · <span id="pedido-telefone"></span>
    </p>
    <p style="color: var(--taupe);" id="pedido-detalhes"></p>

    <form id="form-editar-pedido" class="painel-edicao" hidden>
      <div class="form-row-split">
        <div class="form-row">
          <label for="edit-nome">Nome</label>
          <input type="text" id="edit-nome" required>
        </div>
        <div class="form-row">
          <label for="edit-email">Email</label>
          <input type="email" id="edit-email" required>
        </div>
      </div>
      <div class="form-row-split">
        <div class="form-row">
          <label for="edit-telefone">Telefone</label>
          <input type="text" id="edit-telefone">
        </div>
        <div class="form-row">
          <label for="edit-tipoEvento">Tipo de evento</label>
          <select id="edit-tipoEvento">
            <option value="Casamento">Casamento</option>
            <option value="Aniversário">Aniversário</option>
            <option value="Batizado">Batizado</option>
            <option value="Evento corporativo">Evento corporativo</option>
            <option value="Baby shower">Baby shower</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="form-row-split">
        <div class="form-row">
          <label for="edit-dataEvento">Data do evento</label>
          <input type="date" id="edit-dataEvento">
        </div>
        <div class="form-row">
          <label for="edit-numeroConvidados">Nº de convidados</label>
          <input type="number" id="edit-numeroConvidados" min="0">
        </div>
      </div>
      <div class="form-row">
        <label for="edit-orcamentoAproximado">Orçamento aproximado</label>
        <input type="text" id="edit-orcamentoAproximado" placeholder="ex: 500-1000€">
      </div>
      <div class="form-row">
        <label for="edit-mensagem">Mensagem / notas do pedido</label>
        <textarea id="edit-mensagem" rows="3"></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">Guardar alterações</button>
        <button type="button" id="btn-cancelar-editar" class="btn-cancelar">Cancelar</button>
      </div>
      <p id="editar-feedback" class="form-feedback" role="status" aria-live="polite"></p>
    </form>

    <div class="pedido-resumo">
      <span class="status-pill" id="pedido-status">—</span>
      <select id="status-select" class="status-select">
        <option value="nao_respondido">Não respondido</option>
        <option value="em_andamento">Em andamento</option>
        <option value="concluido">Concluído</option>
      </select>
      <a id="btn-add-calendario" href="#" target="_blank" rel="noopener" class="btn-toggle-fechar" hidden>Adicionar ao calendário</a>
      <button type="button" id="btn-fechar-conversa" class="btn-toggle-fechar">Fechar conversa</button>
    </div>

    <p id="aviso-fechada" class="aviso-fechada" hidden>
      Esta conversa está fechada. <button type="button" id="btn-reabrir-conversa" class="link-perigo">Reabrir conversa</button> para poderes responder outra vez.
    </p>

    <div class="chat-box">
      <div id="chat-mensagens" class="chat-mensagens"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-texto" rows="2" placeholder="Responde ao cliente..." required></textarea>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
      <p id="chat-feedback" class="form-feedback" role="status" aria-live="polite"></p>
    </div>

    <div class="zona-perigo">
      <button type="button" id="btn-mostrar-apagar" class="link-perigo">Apagar esta conversa para sempre</button>

      <div id="painel-apagar" hidden>
        <p>Isto apaga o pedido e toda a conversa <strong>permanentemente</strong>. Não é possível desfazer.</p>
        <div class="form-row-split" style="display:flex; gap:10px; align-items:flex-end;">
          <div style="flex:1;">
            <label for="apagar-senha">Confirma com a palavra-passe de admin</label>
            <input type="password" id="apagar-senha" placeholder="Palavra-passe">
          </div>
          <button type="button" id="btn-confirmar-apagar" class="btn btn-perigo">Apagar para sempre</button>
          <button type="button" id="btn-cancelar-apagar" class="btn-cancelar">Cancelar</button>
        </div>
        <p id="apagar-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div id="estado-erro" hidden class="erro-pedido">
    <h1>Pedido não encontrado</h1>
  </div>
</main>

<script src="../js/admin-session.js"></script>
<script src="../js/admin-chat.js"></script>
</body>
</html>
