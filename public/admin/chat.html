<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversa — Admin — De Cheio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/chat.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/logo512.png">
</head>
<body>

<main class="wrap chat-page">
  <p><a href="/admin/">&larr; Voltar à lista</a></p>

  <div id="estado-carregamento">A carregar...</div>

  <div id="conteudo-pedido" hidden>
    <p class="eyebrow" id="pedido-tipo">—</p>
    <h1 id="pedido-titulo">—</h1>
    <p style="color: var(--taupe); margin-top: -0.6em;">
      <span id="pedido-email"></span> · <span id="pedido-telefone"></span>
    </p>
    <p style="color: var(--taupe);" id="pedido-detalhes"></p>

    <div class="pedido-resumo">
      <span class="status-pill" id="pedido-status">—</span>
      <select id="status-select" class="status-select">
        <option value="nao_respondido">Não respondido</option>
        <option value="em_andamento">Em andamento</option>
        <option value="concluido">Concluído</option>
      </select>
      <button type="button" id="btn-fechar-conversa" class="btn-toggle-fechar">Fechar conversa</button>
    </div>

    <p id="aviso-fechada" class="aviso-fechada" hidden>
      Esta conversa está fechada. <button type="button" id="btn-reabrir-conversa" class="link-perigo">Reabrir conversa</button> para poderes responder outra vez.
    </p>

    <div class="chat-box">
      <div id="chat-mensagens" class="chat-mensagens"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-texto" rows="2" placeholder="Responde ao cliente..." required></textarea>
        <button type="submit" class="btn btn-primary">Enviar</button>
      </form>
      <p id="chat-feedback" class="form-feedback" role="status" aria-live="polite"></p>
    </div>

    <div class="zona-perigo">
      <button type="button" id="btn-mostrar-apagar" class="link-perigo">Apagar esta conversa para sempre</button>

      <div id="painel-apagar" hidden>
        <p>Isto apaga o pedido e toda a conversa <strong>permanentemente</strong>. Não é possível desfazer.</p>
        <div class="form-row-split" style="display:flex; gap:10px; align-items:flex-end;">
          <div style="flex:1;">
            <label for="apagar-senha">Confirma com a palavra-passe de admin</label>
            <input type="password" id="apagar-senha" placeholder="Palavra-passe">
          </div>
          <button type="button" id="btn-confirmar-apagar" class="btn btn-perigo">Apagar para sempre</button>
          <button type="button" id="btn-cancelar-apagar" class="btn-cancelar">Cancelar</button>
        </div>
        <p id="apagar-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <div id="estado-erro" hidden class="erro-pedido">
    <h1>Pedido não encontrado</h1>
  </div>
</main>

<script src="../js/admin-chat.js"></script>
</body>
</html>
