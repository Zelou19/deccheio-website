<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Parceiros — Admin — De Cheio</title>
<style>
/* ---------- Tipos de letra (alojados no próprio site — não se pede nada à Google) ---------- */
@font-face {
  font-family: 'Fraunces';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url(/fonts/fraunces-opsz.woff2) format('woff2-variations'), url(/fonts/fraunces-opsz.woff2) format('woff2');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face {
  font-family: 'Work Sans';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url(/fonts/work-sans.woff2) format('woff2-variations'), url(/fonts/work-sans.woff2) format('woff2');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

/* ---------- Tokens ---------- */
:root {
  --bg: #FAF6EF;
  --bg-alt: #F1E9DC;
  --ink: #322D28;
  --taupe: #8C8175;
  --gold: #B08B4F;
  --wine: #6B2A34;

  --font-display: 'Fraunces', serif;
  --font-body: 'Work Sans', sans-serif;

  --wrap: 1120px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 28px;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 0.4em;
}

h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1.08; font-weight: 500; }
h2 { font-size: clamp(1.7rem, 3vw, 2.4rem); }
h3 { font-size: 1.15rem; }

p { margin: 0 0 1em; color: var(--ink); }

a { color: inherit; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 0.9em;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 0.9em 1.8em;
  border-radius: 2px;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.btn-primary {
  background: var(--wine);
  color: var(--bg);
}
.btn-primary:hover { background: #591f28; }

/* ---------- Header ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 246, 239, 0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(50, 45, 40, 0.08);
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 16px;
  padding-bottom: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.brand-word { font-weight: 500; }
.brand-heart { width: 20px; height: 18px; object-fit: contain; }
.brand-small { font-size: 1.05rem; }

.site-nav {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 0.92rem;
}

.site-nav a { text-decoration: none; color: var(--ink); }
.site-nav a:hover { color: var(--wine); }

.nav-cta {
  background: var(--ink);
  color: var(--bg) !important;
  padding: 0.55em 1.3em;
  border-radius: 2px;
  font-weight: 600;
}
.nav-cta:hover { background: var(--wine) !important; }

/* ---------- Menu hambúrguer (só aparece em mobile) ---------- */
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 90px 0 110px;
}

.hero-motif {
  position: absolute;
  top: -60px;
  right: -140px;
  width: 620px;
  height: 580px;
  color: var(--gold);
  opacity: 0.35;
  pointer-events: none;
}

.hero-inner { position: relative; max-width: 680px; }

.hero-lede {
  font-size: 1.1rem;
  color: var(--ink);
  max-width: 540px;
}

/* ---------- Serviços ---------- */
.servicos { padding: 90px 0; background: var(--bg-alt); }

.servicos-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-top: 40px;
}

.servico-card {
  background: var(--bg);
  padding: 28px 24px;
  border-top: 2px solid var(--gold);
}

.servico-card p { color: var(--taupe); font-size: 0.95rem; margin-bottom: 0; }

/* ---------- Como funciona ---------- */
.como-funciona { padding: 90px 0; }

.passos {
  list-style: none;
  margin: 40px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}

.passos li { border-left: 1px solid rgba(50,45,40,0.15); padding-left: 24px; }

.passo-num {
  display: block;
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--gold);
  margin-bottom: 0.3em;
}

.passos p { color: var(--taupe); font-size: 0.95rem; }

/* ---------- Orçamento (form) ---------- */
.orcamento { padding: 90px 0 120px; background: var(--bg-alt); }

.orcamento-inner {
  display: grid;
  grid-template-columns: 0.9fr 1.3fr;
  gap: 64px;
  align-items: start;
}

.orcamento-intro p:not(.eyebrow) { color: var(--taupe); max-width: 380px; }

.orcamento-gate {
  background: var(--bg);
  padding: 36px;
  border-radius: 4px;
  text-align: center;
}

.orcamento-gate p {
  color: var(--taupe);
  max-width: 420px;
  margin: 0 auto 20px;
}

.quote-form {
  background: var(--bg);
  padding: 36px;
  border-radius: 4px;
}

.form-row { margin-bottom: 18px; }

.form-row-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ink);
}

.opcional { font-weight: 400; color: var(--taupe); }

.imagens-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.imagem-preview-item {
  position: relative;
  width: 76px;
  height: 76px;
}

.imagem-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(50,45,40,0.15);
}

.imagem-preview-remover {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: var(--wine);
  color: var(--bg);
  font-size: 0.8rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.imagem-preview-remover:hover { background: #4d1a21; }

input[type="file"] {
  padding: 10px 0;
  border: none;
  font-size: 0.85rem;
}

input, select, textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: 0.95rem;
  padding: 0.7em 0.8em;
  border: 1px solid rgba(50,45,40,0.25);
  border-radius: 2px;
  background: var(--bg);
  color: var(--ink);
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
  border-color: var(--gold);
}

textarea { resize: vertical; }

.btn-submit { width: 100%; margin-top: 8px; }

.form-feedback {
  margin: 14px 0 0;
  font-size: 0.9rem;
  min-height: 1.2em;
}

.form-feedback.sucesso { color: #2E6B4F; }
.form-feedback.erro { color: var(--wine); }

/* ---------- Footer ---------- */
.site-footer {
  padding: 40px 0;
  border-top: 1px solid rgba(50,45,40,0.1);
}

.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--taupe);
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .servicos-grid { grid-template-columns: repeat(2, 1fr); }
  .passos { grid-template-columns: 1fr; gap: 28px; }
  .orcamento-inner { grid-template-columns: 1fr; }
  .hero-motif { opacity: 0.22; right: -220px; }
}

@media (max-width: 760px) {
  .nav-toggle { display: flex; }

  .site-nav {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    font-size: 0.92rem;
    background: var(--bg);
    border-bottom: 1px solid rgba(50, 45, 40, 0.08);
    padding: 0 20px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
  }

  .site-nav.nav-aberto {
    max-height: 60vh;
    opacity: 1;
    pointer-events: auto;
    padding: 8px 20px 18px;
  }

  .site-nav a,
  .site-nav span,
  .site-nav button {
    width: 100%;
    padding: 12px 0;
    border-bottom: 1px solid rgba(50, 45, 40, 0.06);
  }

  .site-nav .nav-cta {
    text-align: center;
    margin-top: 6px;
    border-bottom: none;
  }
}

@media (max-width: 600px) {
  .servicos-grid { grid-template-columns: 1fr; }
  .form-row-split { grid-template-columns: 1fr; }
  .footer-inner { flex-direction: column; gap: 10px; text-align: center; }
  .hero { padding: 60px 0 80px; }
}
</style>
<style>
.admin-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
  border-bottom: 1px solid rgba(50,45,40,0.1);
  margin-bottom: 32px;
}

.admin-header h1 {
  font-size: 1.4rem;
  margin: 0;
}

.admin-sair {
  font-size: 0.85rem;
  color: var(--taupe);
  text-decoration: none;
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-body);
}
.admin-sair:hover { color: var(--wine); }

.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg-alt);
  border-radius: 6px;
  padding: 18px 20px;
  text-align: left;
}

.stat-card .stat-num {
  display: block;
  font-family: var(--font-display);
  font-size: 2rem;
  color: var(--ink);
  line-height: 1;
}

.stat-card .stat-label {
  font-size: 0.78rem;
  color: var(--taupe);
  letter-spacing: 0.02em;
}

.stat-card.total { border-top: 3px solid var(--ink); }
.stat-card.nao_respondido { border-top: 3px solid var(--wine); }
.stat-card.em_andamento { border-top: 3px solid var(--gold); }
.stat-card.concluido { border-top: 3px solid #2E6B4F; }

.filtros-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.filtros-bar select,
.filtros-bar input {
  width: auto;
  min-width: 160px;
  font-size: 0.88rem;
}

.filtros-bar input[type="search"] { flex: 1; min-width: 200px; }

.pedido-card {
  position: relative;
  background: var(--bg-alt);
  border-radius: 6px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  text-decoration: none;
  color: var(--ink);
}

.status-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
  vertical-align: middle;
}

.status-dot[data-status="nao_respondido"] { background: var(--wine); }
.status-dot[data-status="em_andamento"] { background: var(--gold); }
.status-dot[data-status="concluido"] { background: #2E6B4F; }

.pedido-card-info { flex: 1; min-width: 0; }

.pedido-card-nome {
  font-weight: 600;
  font-size: 1rem;
}

.pedido-card-meta {
  font-size: 0.82rem;
  color: var(--taupe);
  margin-top: 2px;
}

.pedido-card-tag {
  display: inline-block;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--taupe);
  background: var(--bg);
  padding: 0.2em 0.7em;
  border-radius: 999px;
  margin-right: 8px;
}

.pedido-card-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.sem-resultados {
  text-align: center;
  color: var(--taupe);
  padding: 40px 0;
}

@media (max-width: 700px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .pedido-card { flex-direction: column; align-items: flex-start; }
  .pedido-card-actions { width: 100%; justify-content: space-between; }
}
</style>
<style>
/* ---------- Admin: gestão de categorias ---------- */
.nova-categoria-form {
  display: flex;
  gap: 12px;
  margin-bottom: 32px;
}

.nova-categoria-form input {
  flex: 1;
  max-width: 320px;
}

.categoria-bloco {
  background: var(--bg-alt);
  border-radius: 6px;
  padding: 22px 24px;
  margin-bottom: 20px;
}

.categoria-bloco-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.categoria-bloco-header h3 { margin: 0; }

.categoria-apagar {
  font-size: 0.82rem;
  color: var(--taupe);
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-body);
}
.categoria-apagar:hover { color: var(--wine); }

.categoria-fotos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.foto-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 4px;
  overflow: hidden;
}

.foto-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.foto-apagar {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(50,45,40,0.75);
  color: #fff;
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
}
.foto-apagar:hover { background: var(--wine); }

.categoria-sem-fotos {
  color: var(--taupe);
  font-size: 0.88rem;
  font-style: italic;
  margin-bottom: 16px;
}

.upload-foto label {
  display: inline-block;
  font-size: 0.85rem;
  padding: 0.6em 1.2em;
  background: var(--bg);
  border: 1px solid rgba(50,45,40,0.2);
  border-radius: 2px;
  cursor: pointer;
  margin: 0;
}
.upload-foto label:hover { border-color: var(--gold); }
.upload-foto input[type="file"] { display: none; }
.upload-foto .upload-estado { font-size: 0.82rem; color: var(--taupe); margin-left: 10px; }

/* ---------- Página principal: secção "Os nossos eventos" ---------- */
.eventos { padding: 90px 0; background: var(--bg-alt); }

.eventos-abas {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 32px 0;
}

.eventos-aba {
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  padding: 0.6em 1.3em;
  border-radius: 999px;
  border: 1px solid rgba(50,45,40,0.2);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.eventos-aba.ativa {
  background: var(--wine);
  border-color: var(--wine);
  color: var(--bg);
}

.eventos-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.eventos-grid .foto-item {
  aspect-ratio: 4/3;
  border-radius: 6px;
}

.eventos-vazio {
  color: var(--taupe);
  font-style: italic;
}

@media (max-width: 900px) {
  .eventos-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 600px) {
  .eventos-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .categoria-fotos-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
}
</style>
<style>
.novo-parceiro-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 520px;
  margin: 24px 0;
}
.novo-parceiro-form label { font-size: 0.85rem; color: var(--taupe); }
.logo-previa {
  display: flex; align-items: center; justify-content: center;
  min-height: 90px; padding: 12px;
  background: var(--bg-alt); border-radius: 8px;
  color: var(--taupe); font-size: 0.85rem;
}
.logo-previa img { max-width: 220px; max-height: 80px; object-fit: contain; }

.lista-parceiros-admin {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 14px;
  max-width: 760px;
}
.parceiro-admin-item {
  background: var(--bg-alt);
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  text-align: center;
}
.parceiro-admin-item img { max-width: 100%; max-height: 64px; object-fit: contain; }
.parceiro-admin-nome { font-weight: 600; font-size: 0.88rem; overflow-wrap: anywhere; }
.parceiro-admin-apagar {
  background: none; border: none; color: var(--wine);
  text-decoration: underline; cursor: pointer; font-size: 0.82rem;
}
</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/logo512.png">
<style>
/* ---------- Telemóvel: nada deve passar da largura do ecrã ---------- */
.wrap p, .review-texto, .review-admin-texto, .review-admin-autor, .msg-texto { overflow-wrap: anywhere; }
.review-admin-item > div { min-width: 0; }
@media (max-width: 640px) {
  .admin-header { flex-wrap: wrap; gap: 12px; }
  .admin-header > div { flex-wrap: wrap; gap: 4px 16px !important; }
  .admin-sair { padding: 8px 0; }
  .pedido-cabecalho { flex-wrap: wrap; gap: 12px; }
  .wrap [style*="display:flex"] { flex-wrap: wrap; }
  .wrap [style*="display: flex"] { flex-wrap: wrap; }
  .pedido-resumo > * { max-width: 100%; }
  .status-select { max-width: 100%; }
  .btn-toggle-fechar { white-space: normal; text-align: center; }
  .review-admin-item { flex-wrap: wrap; gap: 10px; }
}
</style>
<style>
/* ---------- Telemóvel: margem lateral nas páginas centradas ---------- */
@media (max-width: 880px) {
  main.wrap { padding-left: 22px; padding-right: 22px; }
  .pedido-card-actions { flex-wrap: wrap; }
}
</style>

<body>

<main class="wrap" style="padding-bottom: 80px;">

  <div id="admin-conteudo">

    <div class="admin-header">
      <h1>Parceiros</h1>
      <div style="display:flex; align-items:center; gap:18px;">
        <a href="/admin/orcamentos.html" class="admin-sair" style="text-decoration:none;">Orçamentos</a>
        <a href="/admin/eventos.html" class="admin-sair" style="text-decoration:none;">Os nossos eventos</a>
        <a href="/admin/reviews.html" class="admin-sair admin-so-owner" hidden style="text-decoration:none;">Avaliações</a>
        <a href="/admin/conta.html" class="admin-sair" style="text-decoration:none;">A minha conta</a>
        <a href="/admin/index.html" class="admin-sair" style="text-decoration:none;">&larr; Pedidos de orçamento</a>
      </div>
    </div>

    <p style="color: var(--taupe); font-size: 0.9rem; max-width: 60ch;">
      Os logótipos que adicionares aqui passam, em carrossel, na secção "Parceiros" da página inicial.
      Se não houver nenhum, a secção não aparece.
    </p>

    <form id="form-novo-parceiro" class="novo-parceiro-form">
      <input type="text" id="parceiro-nome" placeholder="Nome do parceiro" maxlength="80" required>
      <input type="text" id="parceiro-link" placeholder="Link do site (opcional)" maxlength="300">
      <label for="parceiro-logo">Logótipo (PNG, JPG, WebP ou GIF — de preferência com fundo transparente)</label>
      <input type="file" id="parceiro-logo" accept="image/png,image/jpeg,image/webp,image/gif" required>
      <div id="logo-previa" class="logo-previa">Sem imagem escolhida</div>
      <button type="submit" class="btn btn-primary">Adicionar parceiro</button>
    </form>
    <p id="parceiro-feedback" class="form-feedback" role="status" aria-live="polite"></p>

    <div id="lista-parceiros" class="lista-parceiros-admin"></div>

  </div>

</main>

<script>
// Script partilhado por todas as páginas do painel de admin.
// Substitui o antigo sistema de "chave de admin" por uma sessão a sério (cookie + login).
// Tem de ser incluído ANTES do script próprio de cada página (admin.js, admin-chat.js, etc.).

window.adminAtual = null;

// Verifica se há sessão válida. Se não houver, manda logo para o login.
// Devolve os dados do admin (username, role) quando a sessão é válida, ou null.
async function protegerPaginaAdmin() {
  try {
    const resposta = await fetch('/api/admin/auth/me');
    if (!resposta.ok) {
      window.location.href = '/admin/login.html';
      return null;
    }
    const dados = await resposta.json();
    window.adminAtual = dados.admin;

    // Elementos marcados com esta classe só aparecem para o dono da conta (ex: link "Utilizadores")
    document.querySelectorAll('.admin-so-owner').forEach((el) => {
      el.hidden = dados.admin.role !== 'owner';
    });

    return dados.admin;
  } catch (erro) {
    window.location.href = '/admin/login.html';
    return null;
  }
}

document.getElementById('btn-sair')?.addEventListener('click', async () => {
  await fetch('/api/admin/auth/logout', { method: 'POST' });
  window.location.href = '/admin/login.html';
});
</script>
<script>
const listaParceiros = document.getElementById('lista-parceiros');
const form = document.getElementById('form-novo-parceiro');
const feedback = document.getElementById('parceiro-feedback');
const inputLogo = document.getElementById('parceiro-logo');
const previa = document.getElementById('logo-previa');
let logoPronto = null; // data URL já reduzida

function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}

function mostrarErro(msg) {
  feedback.textContent = msg;
  feedback.className = 'form-feedback erro';
}

// Reduz o logótipo (máx. 480x200) e guarda-o em PNG, para manter a transparência e não pesar na base de dados.
function reduzirImagem(ficheiro) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(ficheiro);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, 480 / img.naturalWidth, 200 / img.naturalHeight);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * escala));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * escala));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não foi possível ler a imagem.')); };
    img.src = url;
  });
}

inputLogo.addEventListener('change', async () => {
  logoPronto = null;
  feedback.textContent = '';
  const ficheiro = inputLogo.files[0];
  if (!ficheiro) { previa.textContent = 'Sem imagem escolhida'; return; }
  try {
    logoPronto = await reduzirImagem(ficheiro);
    previa.innerHTML = '';
    const img = document.createElement('img');
    img.src = logoPronto; img.alt = 'Pré-visualização';
    previa.appendChild(img);
  } catch (erro) {
    previa.textContent = 'Sem imagem escolhida';
    mostrarErro(erro.message);
  }
});

async function carregarParceiros() {
  const resposta = await fetch('/api/parceiros');
  if (!resposta.ok) return;
  const parceiros = await resposta.json();

  if (parceiros.length === 0) {
    listaParceiros.innerHTML = '<p class="sem-resultados">Ainda não adicionaste nenhum parceiro.</p>';
    return;
  }

  listaParceiros.innerHTML = parceiros.map((p) => `
    <div class="parceiro-admin-item">
      <img src="${p.logo}" alt="${escaparHtml(p.nome)}">
      <div class="parceiro-admin-nome">${escaparHtml(p.nome)}</div>
      <button class="parceiro-admin-apagar" data-id="${p._id}">Apagar</button>
    </div>
  `).join('');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  feedback.textContent = '';
  feedback.className = 'form-feedback';

  if (!logoPronto) { mostrarErro('Escolhe um logótipo.'); return; }

  const resposta = await fetch('/api/parceiros', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nome: document.getElementById('parceiro-nome').value.trim(),
      link: document.getElementById('parceiro-link').value.trim(),
      logo: logoPronto,
    }),
  });
  const resultado = await resposta.json().catch(() => ({}));

  if (!resposta.ok) {
    mostrarErro(resultado.erro || 'Não foi possível adicionar o parceiro.');
    return;
  }

  form.reset();
  logoPronto = null;
  previa.textContent = 'Sem imagem escolhida';
  carregarParceiros();
});

listaParceiros.addEventListener('click', async (event) => {
  if (!event.target.matches('.parceiro-admin-apagar')) return;
  if (!confirm('Tirar este parceiro do site?')) return;

  await fetch(`/api/parceiros/${event.target.dataset.id}`, { method: 'DELETE' });
  carregarParceiros();
});

protegerPaginaAdmin().then((admin) => {
  if (admin) carregarParceiros();
});
</script>
</body>
</html>
