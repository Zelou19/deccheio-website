<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Painel — De Cheio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #FAF6EF;
  --bg-alt: #F1E9DC;
  --ink: #322D28;
  --taupe: #8C8175;
  --gold: #B08B4F;
  --wine: #6B2A34;

  --font-display: 'Fraunces', serif;
  --font-body: 'Work Sans', sans-serif;

  --wrap: 1120px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 28px;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 0.4em;
}

h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1.08; font-weight: 500; }
h2 { font-size: clamp(1.7rem, 3vw, 2.4rem); }
h3 { font-size: 1.15rem; }

p { margin: 0 0 1em; color: var(--ink); }

a { color: inherit; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 0.9em;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 0.9em 1.8em;
  border-radius: 2px;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.btn-primary {
  background: var(--wine);
  color: var(--bg);
}
.btn-primary:hover { background: #591f28; }

/* ---------- Header ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 246, 239, 0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(50, 45, 40, 0.08);
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 16px;
  padding-bottom: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.brand-word { font-weight: 500; }
.brand-heart { width: 20px; height: 18px; object-fit: contain; }
.brand-small { font-size: 1.05rem; }

.site-nav {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 0.92rem;
}

.site-nav a { text-decoration: none; color: var(--ink); }
.site-nav a:hover { color: var(--wine); }

.nav-cta {
  background: var(--ink);
  color: var(--bg) !important;
  padding: 0.55em 1.3em;
  border-radius: 2px;
  font-weight: 600;
}
.nav-cta:hover { background: var(--wine) !important; }

/* ---------- Menu hambúrguer (só aparece em mobile) ---------- */
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 90px 0 110px;
}

.hero-motif {
  position: absolute;
  top: -60px;
  right: -140px;
  width: 620px;
  height: 580px;
  color: var(--gold);
  opacity: 0.35;
  pointer-events: none;
}

.hero-inner { position: relative; max-width: 680px; }

.hero-lede {
  font-size: 1.1rem;
  color: var(--ink);
  max-width: 540px;
}

/* ---------- Serviços ---------- */
.servicos { padding: 90px 0; background: var(--bg-alt); }

.servicos-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-top: 40px;
}

.servico-card {
  background: var(--bg);
  padding: 28px 24px;
  border-top: 2px solid var(--gold);
}

.servico-card p { color: var(--taupe); font-size: 0.95rem; margin-bottom: 0; }

/* ---------- Como funciona ---------- */
.como-funciona { padding: 90px 0; }

.passos {
  list-style: none;
  margin: 40px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}

.passos li { border-left: 1px solid rgba(50,45,40,0.15); padding-left: 24px; }

.passo-num {
  display: block;
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--gold);
  margin-bottom: 0.3em;
}

.passos p { color: var(--taupe); font-size: 0.95rem; }

/* ---------- Orçamento (form) ---------- */
.orcamento { padding: 90px 0 120px; background: var(--bg-alt); }

.orcamento-inner {
  display: grid;
  grid-template-columns: 0.9fr 1.3fr;
  gap: 64px;
  align-items: start;
}

.orcamento-intro p:not(.eyebrow) { color: var(--taupe); max-width: 380px; }

.orcamento-gate {
  background: var(--bg);
  padding: 36px;
  border-radius: 4px;
  text-align: center;
}

.orcamento-gate p {
  color: var(--taupe);
  max-width: 420px;
  margin: 0 auto 20px;
}

.quote-form {
  background: var(--bg);
  padding: 36px;
  border-radius: 4px;
}

.form-row { margin-bottom: 18px; }

.form-row-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ink);
}

.opcional { font-weight: 400; color: var(--taupe); }

.imagens-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.imagem-preview-item {
  position: relative;
  width: 76px;
  height: 76px;
}

.imagem-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(50,45,40,0.15);
}

.imagem-preview-remover {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: var(--wine);
  color: var(--bg);
  font-size: 0.8rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.imagem-preview-remover:hover { background: #4d1a21; }

input[type="file"] {
  padding: 10px 0;
  border: none;
  font-size: 0.85rem;
}

input, select, textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: 0.95rem;
  padding: 0.7em 0.8em;
  border: 1px solid rgba(50,45,40,0.25);
  border-radius: 2px;
  background: var(--bg);
  color: var(--ink);
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
  border-color: var(--gold);
}

textarea { resize: vertical; }

.btn-submit { width: 100%; margin-top: 8px; }

.form-feedback {
  margin: 14px 0 0;
  font-size: 0.9rem;
  min-height: 1.2em;
}

.form-feedback.sucesso { color: #2E6B4F; }
.form-feedback.erro { color: var(--wine); }

/* ---------- Footer ---------- */
.site-footer {
  padding: 40px 0;
  border-top: 1px solid rgba(50,45,40,0.1);
}

.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--taupe);
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .servicos-grid { grid-template-columns: repeat(2, 1fr); }
  .passos { grid-template-columns: 1fr; gap: 28px; }
  .orcamento-inner { grid-template-columns: 1fr; }
  .hero-motif { opacity: 0.22; right: -220px; }
}

@media (max-width: 760px) {
  .nav-toggle { display: flex; }

  .site-nav {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    font-size: 0.92rem;
    background: var(--bg);
    border-bottom: 1px solid rgba(50, 45, 40, 0.08);
    padding: 0 20px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
  }

  .site-nav.nav-aberto {
    max-height: 60vh;
    opacity: 1;
    pointer-events: auto;
    padding: 8px 20px 18px;
  }

  .site-nav a,
  .site-nav span,
  .site-nav button {
    width: 100%;
    padding: 12px 0;
    border-bottom: 1px solid rgba(50, 45, 40, 0.06);
  }

  .site-nav .nav-cta {
    text-align: center;
    margin-top: 6px;
    border-bottom: none;
  }
}

@media (max-width: 600px) {
  .servicos-grid { grid-template-columns: 1fr; }
  .form-row-split { grid-template-columns: 1fr; }
  .footer-inner { flex-direction: column; gap: 10px; text-align: center; }
  .hero { padding: 60px 0 80px; }
}
</style>
<style>
.auth-page {
  padding: 60px 0 100px;
  max-width: 380px;
}

.auth-card {
  background: var(--bg-alt);
  border-radius: 10px;
  padding: 32px 28px;
}

.auth-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 22px;
  border-radius: 999px;
  background: var(--bg);
  padding: 4px;
}

.auth-tab {
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  padding: 0.55em 0;
  border-radius: 999px;
  cursor: pointer;
  color: var(--taupe);
}

.auth-tab.ativo {
  background: var(--wine);
  color: var(--bg);
}

.auth-form { display: flex; flex-direction: column; gap: 12px; }
.auth-form input {
  width: 100%;
  box-sizing: border-box;
}

.auth-form .btn { width: 100%; margin-top: 4px; }

.auth-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
  color: var(--taupe);
  font-size: 0.8rem;
}
.auth-divider::before, .auth-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(50,45,40,0.15);
}

.auth-google-btn { display: flex; justify-content: center; }

.auth-hidden { display: none !important; }
</style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/logo512.png">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="brand">
      <span class="brand-word">De</span>
      <img class="brand-heart" src="/img/fingerprint-heart.png" alt="" aria-hidden="true">
      <span class="brand-word">Cheio</span>
    </a>
  </div>
</header>

<main class="wrap auth-page">

  <div class="auth-card">

    <h1 style="font-size:1.1rem; margin:0 0 18px;">Painel — entrar</h1>

    <form id="form-login-admin" class="auth-form">
      <input type="text" id="admin-username" placeholder="Utilizador ou email" required autocomplete="username">
      <input type="password" id="admin-senha" placeholder="Palavra-passe" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <p id="login-feedback" class="form-feedback" role="status" aria-live="polite"></p>

  </div>

</main>

<script>
const form = document.getElementById('form-login-admin');
const inputUsername = document.getElementById('admin-username');
const inputSenha = document.getElementById('admin-senha');
const feedback = document.getElementById('login-feedback');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  feedback.textContent = '';
  feedback.className = 'form-feedback';

  const botao = form.querySelector('button[type="submit"]');
  botao.disabled = true;

  try {
    const resposta = await fetch('/api/admin/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: inputUsername.value.trim(), senha: inputSenha.value }),
    });
    const resultado = await resposta.json();

    if (!resposta.ok) {
      feedback.textContent = resultado.erro || 'Não foi possível entrar.';
      feedback.classList.add('erro');
      return;
    }

    window.location.href = '/admin/';
  } catch (erro) {
    feedback.textContent = 'Não foi possível entrar. Tenta novamente.';
    feedback.classList.add('erro');
  } finally {
    botao.disabled = false;
  }
});

// Se já houver sessão válida, salta logo para o painel
fetch('/api/admin/auth/me').then((resposta) => {
  if (resposta.ok) window.location.href = '/admin/';
});
</script>
</body>
</html>
