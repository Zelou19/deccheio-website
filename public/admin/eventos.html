<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os nossos eventos — Admin — De Cheio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #FAF6EF;
  --bg-alt: #F1E9DC;
  --ink: #322D28;
  --taupe: #8C8175;
  --gold: #B08B4F;
  --wine: #6B2A34;

  --font-display: 'Fraunces', serif;
  --font-body: 'Work Sans', sans-serif;

  --wrap: 1120px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 28px;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 500;
  color: var(--ink);
  margin: 0 0 0.4em;
}

h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); line-height: 1.08; font-weight: 500; }
h2 { font-size: clamp(1.7rem, 3vw, 2.4rem); }
h3 { font-size: 1.15rem; }

p { margin: 0 0 1em; color: var(--ink); }

a { color: inherit; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 0.75rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 0.9em;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 0.9em 1.8em;
  border-radius: 2px;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.btn-primary {
  background: var(--wine);
  color: var(--bg);
}
.btn-primary:hover { background: #591f28; }

/* ---------- Header ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 246, 239, 0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(50, 45, 40, 0.08);
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 16px;
  padding-bottom: 16px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.02em;
  color: var(--ink);
}

.brand-word { font-weight: 500; }
.brand-heart { width: 20px; height: 18px; object-fit: contain; }
.brand-small { font-size: 1.05rem; }

.site-nav {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 0.92rem;
}

.site-nav a { text-decoration: none; color: var(--ink); }
.site-nav a:hover { color: var(--wine); }

.nav-cta {
  background: var(--ink);
  color: var(--bg) !important;
  padding: 0.55em 1.3em;
  border-radius: 2px;
  font-weight: 600;
}
.nav-cta:hover { background: var(--wine) !important; }

/* ---------- Menu hambúrguer (só aparece em mobile) ---------- */
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--ink);
  border-radius: 2px;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ---------- Hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 90px 0 110px;
}

.hero-motif {
  position: absolute;
  top: -60px;
  right: -140px;
  width: 620px;
  height: 580px;
  color: var(--gold);
  opacity: 0.35;
  pointer-events: none;
}

.hero-inner { position: relative; max-width: 680px; }

.hero-lede {
  font-size: 1.1rem;
  color: var(--ink);
  max-width: 540px;
}

/* ---------- Serviços ---------- */
.servicos { padding: 90px 0; background: var(--bg-alt); }

.servicos-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-top: 40px;
}

.servico-card {
  background: var(--bg);
  padding: 28px 24px;
  border-top: 2px solid var(--gold);
}

.servico-card p { color: var(--taupe); font-size: 0.95rem; margin-bottom: 0; }

/* ---------- Como funciona ---------- */
.como-funciona { padding: 90px 0; }

.passos {
  list-style: none;
  margin: 40px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}

.passos li { border-left: 1px solid rgba(50,45,40,0.15); padding-left: 24px; }

.passo-num {
  display: block;
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--gold);
  margin-bottom: 0.3em;
}

.passos p { color: var(--taupe); font-size: 0.95rem; }

/* ---------- Orçamento (form) ---------- */
.orcamento { padding: 90px 0 120px; background: var(--bg-alt); }

.orcamento-inner {
  display: grid;
  grid-template-columns: 0.9fr 1.3fr;
  gap: 64px;
  align-items: start;
}

.orcamento-intro p:not(.eyebrow) { color: var(--taupe); max-width: 380px; }

.orcamento-gate {
  background: var(--bg);
  padding: 36px;
  border-radius: 4px;
  text-align: center;
}

.orcamento-gate p {
  color: var(--taupe);
  max-width: 420px;
  margin: 0 auto 20px;
}

.quote-form {
  background: var(--bg);
  padding: 36px;
  border-radius: 4px;
}

.form-row { margin-bottom: 18px; }

.form-row-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ink);
}

.opcional { font-weight: 400; color: var(--taupe); }

.imagens-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 10px;
}

.imagem-preview-item {
  position: relative;
  width: 76px;
  height: 76px;
}

.imagem-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(50,45,40,0.15);
}

.imagem-preview-remover {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: var(--wine);
  color: var(--bg);
  font-size: 0.8rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.imagem-preview-remover:hover { background: #4d1a21; }

input[type="file"] {
  padding: 10px 0;
  border: none;
  font-size: 0.85rem;
}

input, select, textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: 0.95rem;
  padding: 0.7em 0.8em;
  border: 1px solid rgba(50,45,40,0.25);
  border-radius: 2px;
  background: var(--bg);
  color: var(--ink);
}

input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
  border-color: var(--gold);
}

textarea { resize: vertical; }

.btn-submit { width: 100%; margin-top: 8px; }

.form-feedback {
  margin: 14px 0 0;
  font-size: 0.9rem;
  min-height: 1.2em;
}

.form-feedback.sucesso { color: #2E6B4F; }
.form-feedback.erro { color: var(--wine); }

/* ---------- Footer ---------- */
.site-footer {
  padding: 40px 0;
  border-top: 1px solid rgba(50,45,40,0.1);
}

.footer-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--taupe);
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .servicos-grid { grid-template-columns: repeat(2, 1fr); }
  .passos { grid-template-columns: 1fr; gap: 28px; }
  .orcamento-inner { grid-template-columns: 1fr; }
  .hero-motif { opacity: 0.22; right: -220px; }
}

@media (max-width: 760px) {
  .nav-toggle { display: flex; }

  .site-nav {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    font-size: 0.92rem;
    background: var(--bg);
    border-bottom: 1px solid rgba(50, 45, 40, 0.08);
    padding: 0 20px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: max-height 0.25s ease, opacity 0.2s ease, padding 0.25s ease;
  }

  .site-nav.nav-aberto {
    max-height: 60vh;
    opacity: 1;
    pointer-events: auto;
    padding: 8px 20px 18px;
  }

  .site-nav a,
  .site-nav span,
  .site-nav button {
    width: 100%;
    padding: 12px 0;
    border-bottom: 1px solid rgba(50, 45, 40, 0.06);
  }

  .site-nav .nav-cta {
    text-align: center;
    margin-top: 6px;
    border-bottom: none;
  }
}

@media (max-width: 600px) {
  .servicos-grid { grid-template-columns: 1fr; }
  .form-row-split { grid-template-columns: 1fr; }
  .footer-inner { flex-direction: column; gap: 10px; text-align: center; }
  .hero { padding: 60px 0 80px; }
}
</style>

<body>

<main class="wrap" style="padding-bottom: 80px;">

  <div id="admin-conteudo">

    <div class="admin-header">
      <h1>Os nossos eventos</h1>
      <div style="display:flex; align-items:center; gap:18px;">
        <a href="/admin/orcamentos.html" class="admin-sair" style="text-decoration:none;">Orçamentos</a>
        <a href="/admin/calendario.html" class="admin-sair" style="text-decoration:none;">Calendário</a>
        <a href="/admin/reviews.html" class="admin-sair admin-so-owner" hidden style="text-decoration:none;">Avaliações</a>
        <a href="/admin/conta.html" class="admin-sair" style="text-decoration:none;">A minha conta</a>
        <a href="/admin/index.html" class="admin-sair" style="text-decoration:none;">&larr; Pedidos de orçamento</a>
      </div>
    </div>

    <form id="form-nova-categoria" class="nova-categoria-form">
      <input type="text" id="nome-categoria" placeholder="Nome da categoria (ex: Casamentos)" required>
      <button type="submit" class="btn btn-primary">Criar categoria</button>
    </form>
    <p id="categoria-feedback" class="form-feedback" role="status" aria-live="polite"></p>

    <div id="lista-categorias"></div>

  </div>

</main>

<script>
// Script partilhado por todas as páginas do painel de admin.
// Substitui o antigo sistema de "chave de admin" por uma sessão a sério (cookie + login).
// Tem de ser incluído ANTES do script próprio de cada página (admin.js, admin-chat.js, etc.).

window.adminAtual = null;

// Verifica se há sessão válida. Se não houver, manda logo para o login.
// Devolve os dados do admin (username, role) quando a sessão é válida, ou null.
async function protegerPaginaAdmin() {
  try {
    const resposta = await fetch('/api/admin/auth/me');
    if (!resposta.ok) {
      window.location.href = '/admin/login.html';
      return null;
    }
    const dados = await resposta.json();
    window.adminAtual = dados.admin;

    // Elementos marcados com esta classe só aparecem para o dono da conta (ex: link "Utilizadores")
    document.querySelectorAll('.admin-so-owner').forEach((el) => {
      el.hidden = dados.admin.role !== 'owner';
    });

    return dados.admin;
  } catch (erro) {
    window.location.href = '/admin/login.html';
    return null;
  }
}

document.getElementById('btn-sair')?.addEventListener('click', async () => {
  await fetch('/api/admin/auth/logout', { method: 'POST' });
  window.location.href = '/admin/login.html';
});
</script>
<script>
const listaCategorias = document.getElementById('lista-categorias');
const formNovaCategoria = document.getElementById('form-nova-categoria');
const inputNomeCategoria = document.getElementById('nome-categoria');
const categoriaFeedback = document.getElementById('categoria-feedback');

function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}

async function carregarCategorias() {
  const resposta = await fetch('/api/categorias');

  if (!resposta.ok) {
    listaCategorias.innerHTML = '<p class="sem-resultados">Não foi possível carregar as categorias.</p>';
    return;
  }

  const categorias = await resposta.json();
  renderizarCategorias(categorias);
}

function renderizarCategorias(categorias) {
  if (categorias.length === 0) {
    listaCategorias.innerHTML = '<p class="sem-resultados">Ainda não criaste nenhuma categoria.</p>';
    return;
  }

  listaCategorias.innerHTML = categorias.map((cat) => `
    <div class="categoria-bloco" data-id="${cat._id}">
      <div class="categoria-bloco-header">
        <h3>${escaparHtml(cat.nome)}</h3>
        <button class="categoria-apagar" data-acao="apagar-categoria" data-id="${cat._id}">Apagar categoria</button>
      </div>

      ${cat.fotos.length === 0
        ? '<p class="categoria-sem-fotos">Ainda sem fotos.</p>'
        : `<div class="categoria-fotos-grid">
            ${cat.fotos.map((foto) => `
              <div class="foto-item">
                <img src="${foto.dataUrl}" alt="${escaparHtml(foto.legenda) || escaparHtml(cat.nome)}">
                <button class="foto-apagar" title="Apagar foto" data-acao="apagar-foto" data-cat-id="${cat._id}" data-foto-id="${foto._id}">&times;</button>
              </div>
            `).join('')}
          </div>`
      }

      <div class="upload-foto">
        <label>
          Adicionar foto
          <input type="file" accept="image/*" data-acao="upload-foto" data-cat-id="${cat._id}">
        </label>
        <span class="upload-estado" data-estado-id="${cat._id}"></span>
      </div>
    </div>
  `).join('');
}

function ficheiroParaDataUrl(ficheiro) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = () => resolve(leitor.result);
    leitor.onerror = reject;
    leitor.readAsDataURL(ficheiro);
  });
}

listaCategorias.addEventListener('click', async (event) => {
  const alvo = event.target;

  if (alvo.dataset.acao === 'apagar-categoria') {
    if (!confirm('Apagar esta categoria e todas as suas fotos?')) return;
    await fetch(`/api/categorias/${alvo.dataset.id}`, {
      method: 'DELETE',
    });
    carregarCategorias();
  }

  if (alvo.dataset.acao === 'apagar-foto') {
    await fetch(`/api/categorias/${alvo.dataset.catId}/fotos/${alvo.dataset.fotoId}`, {
      method: 'DELETE',
    });
    carregarCategorias();
  }
});

listaCategorias.addEventListener('change', async (event) => {
  const alvo = event.target;
  if (alvo.dataset.acao !== 'upload-foto') return;

  const ficheiro = alvo.files[0];
  if (!ficheiro) return;

  const catId = alvo.dataset.catId;
  const estado = document.querySelector(`[data-estado-id="${catId}"]`);
  estado.textContent = 'A enviar...';

  try {
    const dataUrl = await ficheiroParaDataUrl(ficheiro);
    const resposta = await fetch(`/api/categorias/${catId}/fotos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataUrl }),
    });

    if (!resposta.ok) {
      const erro = await resposta.json();
      throw new Error(erro.erro || 'Não foi possível enviar a foto.');
    }

    carregarCategorias();
  } catch (erro) {
    estado.textContent = erro.message;
  }
});

formNovaCategoria.addEventListener('submit', async (event) => {
  event.preventDefault();
  categoriaFeedback.textContent = '';
  categoriaFeedback.className = 'form-feedback';

  const nome = inputNomeCategoria.value.trim();
  if (!nome) return;

  const resposta = await fetch('/api/categorias', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome }),
  });
  const resultado = await resposta.json();

  if (!resposta.ok) {
    categoriaFeedback.textContent = resultado.erro || 'Não foi possível criar a categoria.';
    categoriaFeedback.classList.add('erro');
    return;
  }

  inputNomeCategoria.value = '';
  carregarCategorias();
});

protegerPaginaAdmin().then((admin) => {
  if (admin) carregarCategorias();
});
</script>
</body>
</html>
